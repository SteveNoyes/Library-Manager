<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Library Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>My Library</h1>
      <p class="subtitle">Manage your personal book collection</p>
      <div id="stats" class="stats">
        <div class="stat-card">
          <span class="stat-number" id="total-books">0</span>
          <span class="stat-label">Total Books</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="total-pages">0</span>
          <span class="stat-label">Total Pages</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="avg-pages">0</span>
          <span class="stat-label">Avg Pages</span>
        </div>
      </div>
    </header>

    <main>
      <section class="card add-book-section">
        <h2>Add a New Book</h2>
        <form id="book-form">
          <div class="form-row">
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" placeholder="Enter book title" required>
            </div>
            <div class="form-group">
              <label for="author">Author</label>
              <input type="text" id="author" name="author" placeholder="Enter author name" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="year">Year Published</label>
              <input type="number" id="year" name="year" placeholder="e.g. 2020" min="1000" max="2099">
            </div>
            <div class="form-group">
              <label for="pages">Pages</label>
              <input type="number" id="pages" name="pages" placeholder="e.g. 300" min="1">
            </div>
            <div class="form-group">
              <label for="genre">Genre</label>
              <select id="genre" name="genre">
                <option value="Fiction">Fiction</option>
                <option value="Non-Fiction">Non-Fiction</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Science">Science</option>
                <option value="Technology">Technology</option>
                <option value="History">History</option>
                <option value="Biography">Biography</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add to Library</button>
        </form>
      </section>

      <section class="card controls-section">
        <div class="controls">
          <div class="filter-group">
            <button class="btn filter-btn active" data-filter="all">All</button>
            <button class="btn filter-btn" data-filter="Fiction">Fiction</button>
            <button class="btn filter-btn" data-filter="Non-Fiction">Non-Fiction</button>
            <button class="btn filter-btn" data-filter="Fantasy">Fantasy</button>
            <button class="btn filter-btn" data-filter="Science">Science</button>
          </div>
          <div class="sort-group">
            <button class="btn btn-sort" id="sort-title">Sort by Title</button>
            <button class="btn btn-sort" id="sort-year">Sort by Year</button>
          </div>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search by title or author...">
          <button class="btn btn-search" id="search-btn">Search</button>
        </div>
      </section>

      <section class="card library-section">
        <h2>Your Books</h2>
        <div id="library" class="book-grid">
        </div>
        <p id="empty-message" class="empty-message">No books to display. Add your first book above!</p>
      </section>
    </main>

    <footer class="footer">
      <p>Personal Library Manager — Built with JavaScript</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
